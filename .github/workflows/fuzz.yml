name: Fuzz

# Weekly long-mode fuzz run (tests/fuzz, `make fuzz`). Pull requests run only the short mode's
# pinned regressions inside `make test`; this run explores fresh inputs with a time budget per
# target and a seed that changes every week, so a red run is a new finding: reproduce it with the
# seed in the uploaded report, pin a regression test, then fix (CONTRIBUTING.md section 2).

on:
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.11"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # Ten targets x SPENDGATE_FUZZ_SECONDS, run one after another, plus setup.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SPENDGATE_FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --frozen --all-extras
      - name: Fuzz every target for SPENDGATE_FUZZ_SECONDS (seed from the run number)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fuzz-reports"
          export SPENDGATE_FUZZ_REPORT_DIR="$RUNNER_TEMP/fuzz-reports"
          export SPENDGATE_FUZZ_SEED="$((20261117 + RUN_NUMBER))"
          echo "seed: $SPENDGATE_FUZZ_SEED" >> "$GITHUB_STEP_SUMMARY"
          make fuzz
      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reports
          path: ${{ runner.temp }}/fuzz-reports
          if-no-files-found: warn
          retention-days: 30
