version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # A new Python minor (3.13 -> 3.14) changes the supported floor (decisions D7): an ADR, not
    # a Dependabot bump. Digest and patch updates of the pinned 3.13 image still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
