# 20261123095841 / 20261125184041, read 2026-11-26): a few products and their on-demand terms.
models:
  - id: anthropic.claude-haiku-5-5
    price: [AmazonBedrockFoundationModels, Anthropic, "Claude Haiku 5.5"]
    card: anthropic-claude-haiku-5-5
    keep_bare: "Kept for the test."
    geo:
      us: [us-east-1]
      eu: [eu-west-1, eu-west-2]
    global: [eu-west-1, eu-west-2, us-east-1]
    limits: { max_output_tokens: 128000, context_window: 1000000, max_image_tokens: 6000 }
    long_context: { threshold_input_tokens: 100000 }
