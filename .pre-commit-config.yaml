# Local hooks so tool versions come from uv.lock, not a second pin list.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy --strict src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: commit-message-check
        name: commit message check
        entry: scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]
      - id: commit-identity-check
        name: commit identity check
        entry: scripts/check-commit-identity.sh
        language: system
        stages: [commit-msg]
      - id: no-ai-traces
        name: no assistant traces
        entry: scripts/check-no-ai-traces.sh
        language: system
        pass_filenames: false
        always_run: true
  # gitleaks is not a Python tool, so it comes from its own repository, pinned to a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1  # pragma: allowlist secret
    hooks:
      - id: gitleaks
