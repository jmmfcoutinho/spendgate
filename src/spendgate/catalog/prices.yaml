# spendgate seed price catalog (schema: schema.json). Prices are quoted decimal strings in the entry's currency.
# Compiled 2026-11-13 from each provider's own pages / public price feeds (see source_url and per-entry notes).
# verified: true = every price on the entry was read today from the provider's own page or official public price feed.
# No Realtime entries (on the roadmap). Bedrock entries are generated per Region from the AWS Price List (section below).
# Known schema gaps: Anthropic/Bedrock have 5m and 1h cache-write prices but only one cache_write meter exists, so the
# dearer 1h price is stored (never lower). Batch/Flex/Priority variants are not seeded. Vertex AI pricing page could not be
# read, so no Vertex-specific price is encoded (google/* entries are Gemini API prices).
catalog_version: 1
updated: "2026-11-13"

providers:
  openai: { free_statuses: [429] }
  azure_openai: { free_statuses: [429] }
  anthropic: { free_statuses: [429, 529] }
  bedrock: { free_statuses: [429] }
  google: { free_statuses: [429] }
  azure_speech: { free_statuses: [429] }
  elevenlabs: { free_statuses: [429] }

models:
  # ===================== OpenAI (direct) =====================
  # Page: developers.openai.com/api/docs/pricing and /models/<id>. Long context: prompts over 272K input tokens price the
  # whole request at 2x input/cache, 1.5x output. Max output 128,000, context 1,050,000 (model pages).
  # max_image_tokens: developers.openai.com/api/docs/guides/images-vision, read 2026-11-22: gpt-6-astra bills up to 30,000
  # patches x 1.2 = 36,000 tokens per image (detail original / auto); 45,000 = +25%. gpt-6-luna is not in that table, so it
  # keeps the estimator default (61,000).
  - id: openai/gpt-6-astra
    mode: responses
    currency: USD
    effective_from: "2026-11-13"
    source_url: https://developers.openai.com/api/docs/models/gpt-6-astra
    verified: true
    checked_on: "2026-11-13"
    note: "Flagship. Standard tier. Pricing page lists 10/1/50; model page adds cache write 12.50."
    deployment_type: standard
    meters: { input_per_mtok: "10", cached_input_per_mtok: "1", cache_write_per_mtok: "12.5", output_per_mtok: "50" }
    long_context: { threshold_input_tokens: 272000, input_multiplier: "2", output_multiplier: "1.5" }
    limits: { max_output_tokens: 128000, context_window: 1050000, max_image_tokens: 45000 }
  - id: openai/gpt-6-luna
    mode: responses
    currency: USD
    effective_from: "2026-11-13"
    source_url: https://developers.openai.com/api/docs/models/gpt-6-luna
    verified: true
    checked_on: "2026-11-13"
    note: "Small/cheap model. Standard tier."
    deployment_type: standard
    meters: { input_per_mtok: "0.1", cached_input_per_mtok: "0.01", cache_write_per_mtok: "0.125", output_per_mtok: "0.5" }
    long_context: { threshold_input_tokens: 272000, input_multiplier: "2", output_multiplier: "1.5" }
    limits: { max_output_tokens: 128000, context_window: 1050000 }
  - id: openai/text-embedding-3-small
    mode: embedding
    currency: USD
    effective_from: "2026-11-13"
    source_url: https://developers.openai.com/api/docs/pricing
    verified: true
    checked_on: "2026-11-13"
    meters: { input_per_mtok: "0.02" }

  # --- Every other text model the chat and Responses endpoints serve (issue #108) ---
  # Prices: developers.openai.com/api/docs/pricing, Standard tier; limits, deprecation flags and per-model rules:
  # developers.openai.com/api/docs/models/<id>; shutdown dates: developers.openai.com/api/docs/deprecations. All read
  # 2026-11-26. Cache write is the 30-minute price: the 12-hour price needs `prompt_cache_retention`, which the gateway
  # refuses. Models whose pricing page lists no cache-write or cached-input price have no such meter (the cost falls back
  # to the input price, never lower). Long context (over 272K input: 2x input, cached and cache write, 1.5x output) only
  # where the pricing page lists long-context prices. Not encoded: gpt-5.6-sol (its price is promotional "until November
  # 30, 2026" and the page gives no later price), the Cyber, Rosalind, Law and Healthcare models (trusted access or
  # promotional prices, and no model page or no long-context cache-write price), gpt-5-search-api (search tool), image,
  # Realtime, audio and GPT-Live models (not served), gpt-4o-mini-tts (billed per audio token; the speech adapter reports
  # only characters). max_image_tokens stays at the estimator default: the vision guide covers only gpt-6-astra.
