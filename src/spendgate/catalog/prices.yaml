  # ===================== Google (Gemini API, AI Studio) =====================
  # Page: ai.google.dev/gemini-api/docs/pricing (redirects to aistudio.google.com/docs/pricing), Standard paid tier.
  # Vertex AI pricing page could not be read by the fetcher, so Vertex-specific prices are not encoded.
  # max_output_tokens 65536: the models page says "65K / 1M" for Gemini 4 (ambiguous) and is silent for 3.5 Flash-Lite; the
  # lower figure is used (it is sent as the cap, so cost is bounded). Context window 1M per models page for Gemini 4.
  # max_image_tokens: aistudio.google.com/docs/media-resolution, read 2026-11-22, table "Gemini 4 and Gemini 3 models":
  # at most 1,120 tokens per image at the default resolution; 1,400 = +25% for gemini-4-carbon. ultra_high (2,240) is set
  # per content item, which the Gemini translation never sends. Conflicting rule: aistudio.google.com/docs/image-understanding
  # (same date) still describes 258 tokens per 768x768 tile with no cap. The capped page names no model, so
  # gemini-3.5-flash-lite is not explicitly covered and keeps the estimator default (61,000).
