# Reviewed allow-list for `scripts/litellm_prices.py diff`.
#
# A difference listed here no longer fails the weekly cross-check. Rules, enforced by the script:
#   - differences: only `relation: ours_higher` exists. Our price below LiteLLM's always fails.
#   - deprecations: LiteLLM-only dates Microsoft's own schedule does not list ("unconfirmed"), or a
#     date of ours from the provider's schedule that is earlier than LiteLLM's ("ours_earlier":
#     the catalog refuses the model sooner). The exact LiteLLM date is part of the item, so a
#     changed date fails again.
#   - long_contexts: LiteLLM lists a long-context rate we do not carry, and the provider bills none
#     ("not_offered": its own price list has no long-context price, and its model card caps the
#     context at that threshold or below). The exact LiteLLM threshold is part of the item. A
#     long-context rule of ours that differs from LiteLLM's is never accepted.
#   - Every item names who accepted it and when, and expires at most 90 days later. After that it
#     fails again until someone re-reviews it against the provider's page and renews it.
# Add an item only after reading the provider's own page; do not add one to silence a failure.
differences:
  - id: azure_openai/whisper
    meters: [audio_input_per_minute]
    relation: ours_higher
    reason: "Catalog stores the highest regional batch meter (0.4752 USD/h) as an upper bound; LiteLLM has the global 0.36 USD/h. Azure Retail Prices API, verified 2026-11-13."
    accepted_by: jmmfcoutinho
    accepted_on: "2026-11-18"
    expires: "2027-02-16"
