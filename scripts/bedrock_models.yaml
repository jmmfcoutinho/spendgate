# Reviewed input of scripts/bedrock_prices.py: what the AWS Price List does not say.
#
# Read from AWS's model cards on 2026-11-26 (https://docs.aws.amazon.com/bedrock/latest/userguide/
# model-card-<card>.md, the bedrock-runtime tables only):
#   id          the model id Converse takes (`modelId`), without a profile prefix
#   price       [offer, provider, model] as the Price List names the model (attributes.provider and
#               attributes.model; "" when the Price List gives no provider)
#   in_region   Regions where the bare id is served in-Region (only where the card both marks the
#               Region In-Region and gives an in-Region endpoint)
#   geo         each geographic inference profile prefix and its source Regions
#   global      source Regions of the global profile
#   limits      max_output_tokens (required) and context_window from the card ("128K" = 128000, the
#               lower reading); max_image_tokens 6000 for Claude only (see prices.yaml)
#   long_context.threshold_input_tokens  only where the card documents it
#   deprecation_date  the card's EOL date for a Legacy model
#   keep_bare   a bare id with no in-Region use that stays priced, and why
# A model the Price List names must be under `models` or `skip` (with the reason it is left out);
# the script refuses any other. Change this file by re-reading the card, never by guessing.

region_sets:  # YAML anchors for the long Region lists the model cards repeat
